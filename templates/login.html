<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 · 随心创</title>
  <style>
    :root {
      --primary: #6d5efc;
      --primary-dark: #5646e0;
      --bg: #f6f7fb;
      --card: #ffffff;
      --text: #1f2330;
      --muted: #8a90a3;
      --border: #e8eaf1;
      --success: #22b07d;
      --failed: #e05050;
      --shadow: 0 10px 40px rgba(30, 35, 70, .10);
      --radius: 16px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; min-height: 100vh; display: flex; flex-direction: column; }
    a { color: var(--primary); text-decoration: none; }

    header { background: var(--card); border-bottom: 1px solid var(--border); }
    .header-inner { max-width: 1160px; margin: 0 auto; padding: 14px 24px; display: flex; align-items: center; }
    .logo { font-size: 20px; font-weight: 800; color: var(--primary); display: flex; align-items: center; gap: 8px; }
    .logo .dot { width: 10px; height: 10px; border-radius: 50%; background: linear-gradient(135deg, #6d5efc, #22b07d); }
    .back-home { margin-left: auto; font-size: 14px; color: var(--muted); font-weight: 600; }
    .back-home:hover { color: var(--primary); }

    main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
    .auth-card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); width: 420px; max-width: 100%; padding: 38px 36px; }
    .auth-card h1 { font-size: 26px; font-weight: 800; margin-bottom: 6px; }
    .auth-card .sub { color: var(--muted); font-size: 14px; margin-bottom: 26px; }
    .field { margin-bottom: 18px; }
    .field label { display: block; font-size: 14px; font-weight: 700; margin-bottom: 8px; }
    input[type=text], input[type=password] { width: 100%; border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; font-size: 14px; font-family: inherit; transition: .15s; background: #fff; }
    input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(109,94,252,.1); }
    .btn { border: 0; border-radius: 10px; padding: 13px 18px; font-size: 16px; font-weight: 700; cursor: pointer; transition: .15s; font-family: inherit; }
    .btn-primary { background: var(--primary); color: #fff; width: 100%; }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-primary:disabled { background: #b9b4ec; cursor: not-allowed; }
    .switch { text-align: center; margin-top: 20px; font-size: 14px; color: var(--muted); }
    .switch a { font-weight: 700; }
    .err-box { background: #fff2f2; color: var(--failed); padding: 11px 14px; border-radius: 10px; font-size: 13px; margin-bottom: 18px; display: none; }
    .err-box.show { display: block; }

    #toast { position: fixed; top: 80px; left: 50%; transform: translateX(-50%) translateY(-20px); background: #1f2330; color: #fff; padding: 12px 22px; border-radius: 10px; font-size: 14px; opacity: 0; pointer-events: none; transition: .25s; z-index: 200; }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    #toast.success { background: var(--success); }
  </style>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="logo"><span class="dot"></span>随心创</div>
    <a class="back-home" href="/">← 返回首页</a>
  </div>
</header>

<main>
  <div class="auth-card">
    <h1>欢迎回来</h1>
    <p class="sub">登录后继续你的 AI 创作</p>
    <div class="err-box" id="errBox"></div>
    <form id="loginForm">
      <div class="field">
        <label>用户名或邮箱</label>
        <input type="text" id="identifier" placeholder="用户名 / 邮箱" autocomplete="username">
      </div>
      <div class="field">
        <label>密码</label>
        <input type="password" id="password" placeholder="密码" autocomplete="current-password">
      </div>
      <button class="btn btn-primary" type="submit" id="submitBtn">登录</button>
    </form>
    <div class="switch">还没有账号？<a href="/register/">立即注册</a></div>
  </div>
</main>

<div id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
const TOKEN_KEY = 'cx_access';
const USER_KEY = 'cx_user';

function toast(msg, type = '') {
  const t = $('toast');
  t.textContent = msg;
  t.className = 'show ' + type;
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.className = '', 2600);
}
function showError(msg) {
  $('errBox').textContent = msg;
  $('errBox').classList.add('show');
}
function clearError() { $('errBox').classList.remove('show'); }

// 登录成功后跳回的来源页，默认首页；校验只接受本站相对路径，避免开放跳转
function nextUrl() {
  const p = new URLSearchParams(location.search).get('next') || '/';
  return p.startsWith('/') && !p.startsWith('//') ? p : '/';
}

$('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  clearError();
  const identifier = $('identifier').value.trim();
  const password = $('password').value;
  if (!identifier || !password) return showError('请填写用户名和密码');

  const btn = $('submitBtn');
  btn.disabled = true; btn.textContent = '登录中...';
  try {
    const res = await fetch('/api/users/login/', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: identifier, password }),
    });
    const body = await res.json();
    if (!res.ok || body.code !== 0) throw new Error(body.message || '登录失败');
    localStorage.setItem(TOKEN_KEY, body.data.access);
    localStorage.setItem(USER_KEY, JSON.stringify(body.data.user));
    toast('登录成功', 'success');
    setTimeout(() => { location.href = nextUrl(); }, 400);
  } catch (err) {
    showError(err.message || '登录失败，请稍后重试');
  } finally {
    btn.disabled = false; btn.textContent = '登录';
  }
});
</script>
</body>
</html>
