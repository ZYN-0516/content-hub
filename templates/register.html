<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注册 · 随心创</title>
  <style>
    :root {
      --primary: #6d5efc;
      --primary-dark: #5646e0;
      --bg: #f6f7fb;
      --card: #ffffff;
      --text: #1f2330;
      --muted: #8a90a3;
      --border: #e8eaf1;
      --success: #22b07d;
      --failed: #e05050;
      --shadow: 0 10px 40px rgba(30, 35, 70, .10);
      --radius: 16px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; min-height: 100vh; display: flex; flex-direction: column; }
    a { color: var(--primary); text-decoration: none; }

    header { background: var(--card); border-bottom: 1px solid var(--border); }
    .header-inner { max-width: 1160px; margin: 0 auto; padding: 14px 24px; display: flex; align-items: center; }
    .logo { font-size: 20px; font-weight: 800; color: var(--primary); display: flex; align-items: center; gap: 8px; }
    .logo .dot { width: 10px; height: 10px; border-radius: 50%; background: linear-gradient(135deg, #6d5efc, #22b07d); }
    .back-home { margin-left: auto; font-size: 14px; color: var(--muted); font-weight: 600; }
    .back-home:hover { color: var(--primary); }

    main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
    .auth-card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); width: 440px; max-width: 100%; padding: 36px; }
    .auth-card h1 { font-size: 26px; font-weight: 800; margin-bottom: 6px; }
    .auth-card .sub { color: var(--muted); font-size: 14px; margin-bottom: 24px; }
    .field { margin-bottom: 15px; }
    .field label { display: block; font-size: 14px; font-weight: 700; margin-bottom: 7px; }
    .field .tip { font-weight: 400; color: var(--muted); font-size: 12px; margin-left: 4px; }
    input[type=text], input[type=password] { width: 100%; border: 1px solid var(--border); border-radius: 10px; padding: 11px 14px; font-size: 14px; font-family: inherit; transition: .15s; background: #fff; }
    input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(109,94,252,.1); }
    input.invalid { border-color: var(--failed); }
    .field-error { color: var(--failed); font-size: 12px; margin-top: 5px; display: none; }
    .field-error.show { display: block; }
    .btn { border: 0; border-radius: 10px; padding: 13px 18px; font-size: 16px; font-weight: 700; cursor: pointer; transition: .15s; font-family: inherit; }
    .btn-primary { background: var(--primary); color: #fff; width: 100%; }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-primary:disabled { background: #b9b4ec; cursor: not-allowed; }
    .switch { text-align: center; margin-top: 20px; font-size: 14px; color: var(--muted); }
    .switch a { font-weight: 700; }
    .err-box { background: #fff2f2; color: var(--failed); padding: 11px 14px; border-radius: 10px; font-size: 13px; margin-bottom: 18px; display: none; }
    .err-box.show { display: block; }

    #toast { position: fixed; top: 80px; left: 50%; transform: translateX(-50%) translateY(-20px); background: #1f2330; color: #fff; padding: 12px 22px; border-radius: 10px; font-size: 14px; opacity: 0; pointer-events: none; transition: .25s; z-index: 200; }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    #toast.success { background: var(--success); }
  </style>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="logo"><span class="dot"></span>随心创</div>
    <a class="back-home" href="/">← 返回首页</a>
  </div>
</header>

<main>
  <div class="auth-card">
    <h1>创建账号</h1>
    <p class="sub">加入随心创，开启 AI 创作之旅</p>
    <div class="err-box" id="errBox"></div>
    <form id="registerForm" novalidate>
      <div class="field">
        <label>用户名 <span class="tip">字母开头，4-20 位，仅字母/数字/下划线</span></label>
        <input type="text" id="username" placeholder="例如：creator_2026" autocomplete="username">
        <div class="field-error" id="usernameErr"></div>
      </div>
      <div class="field">
        <label>邮箱</label>
        <input type="text" id="email" placeholder="your@email.com" autocomplete="email">
        <div class="field-error" id="emailErr"></div>
      </div>
      <div class="field">
        <label>密码 <span class="tip">8-20 位，含字母和数字</span></label>
        <input type="password" id="password" placeholder="8-20 位，含字母和数字" autocomplete="new-password">
        <div class="field-error" id="passwordErr"></div>
      </div>
      <div class="field">
        <label>确认密码</label>
        <input type="password" id="password2" placeholder="再次输入密码" autocomplete="new-password">
        <div class="field-error" id="password2Err"></div>
      </div>
      <button class="btn btn-primary" type="submit" id="submitBtn">注册</button>
    </form>
    <div class="switch">已有账号？<a href="/login/">去登录</a></div>
  </div>
</main>

<div id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);

// 与后端 RegisterSerializer 的正则保持一致
const USERNAME_RE = /^[A-Za-z][A-Za-z0-9_]{3,19}$/;
const PASSWORD_RE = /^(?=.*[A-Za-z])(?=.*\d)[A-Za-z0-9_@#$%^&*+=!?.\-]{8,20}$/;
const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

function toast(msg, type = '') {
  const t = $('toast');
  t.textContent = msg;
  t.className = 'show ' + type;
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.className = '', 2600);
}
function showError(msg) {
  $('errBox').textContent = msg;
  $('errBox').classList.add('show');
}
function clearError() { $('errBox').classList.remove('show'); }
function setFieldError(inputId, errId, msg) {
  const input = $(inputId), err = $(errId);
  if (msg) { input.classList.add('invalid'); err.textContent = msg; err.classList.add('show'); }
  else { input.classList.remove('invalid'); err.classList.remove('show'); }
}

// 保留来源页，注册成功后带去登录页
function nextParam() {
  const p = new URLSearchParams(location.search).get('next') || '/';
  return p.startsWith('/') && !p.startsWith('//') ? p : '/';
}

$('registerForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  clearError();
  const username = $('username').value.trim();
  const email = $('email').value.trim();
  const password = $('password').value;
  const password2 = $('password2').value;

  // 前端正则校验：先清掉旧提示
  setFieldError('username', 'usernameErr', '');
  setFieldError('email', 'emailErr', '');
  setFieldError('password', 'passwordErr', '');
  setFieldError('password2', 'password2Err', '');

  let invalid = false;
  if (!USERNAME_RE.test(username)) {
    setFieldError('username', 'usernameErr', '账号需字母开头，4-20 位，仅字母/数字/下划线'); invalid = true;
  }
  if (!EMAIL_RE.test(email)) {
    setFieldError('email', 'emailErr', '请填写有效的邮箱地址'); invalid = true;
  }
  if (!PASSWORD_RE.test(password)) {
    setFieldError('password', 'passwordErr', '密码需 8-20 位，且至少包含一个字母和一个数字'); invalid = true;
  }
  if (password !== password2) {
    setFieldError('password2', 'password2Err', '两次输入的密码不一致'); invalid = true;
  }
  if (invalid) return;

  const btn = $('submitBtn');
  btn.disabled = true; btn.textContent = '注册中...';
  try {
    const res = await fetch('/api/users/register/', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, email, password }),
    });
    const body = await res.json();
    if (!res.ok || body.code !== 0) throw new Error(body.message || '注册失败');
    toast('注册成功，请登录', 'success');
    // 注册成功后跳转到登录页进行登录（不直接登录）
    setTimeout(() => {
      location.href = '/login/?next=' + encodeURIComponent(nextParam());
    }, 500);
  } catch (err) {
    showError(err.message || '注册失败，请稍后重试');
  } finally {
    btn.disabled = false; btn.textContent = '注册';
  }
});
</script>
</body>
</html>
